name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  demo:
    name: demo (py${{ matrix.python-version }})
    # 3.9 已经没有 ubuntu-latest（26.04）的 toolcache，钉回 22.04 继续测它，
    # 免得"声明支持 3.9 却根本没在 CI 里跑过"。
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mask]"

      - name: entry point
        run: grabtag --help

      - name: plan + build on the demo image
        run: |
          mkdir -p build
          python examples/make_demo.py build/demo.png
          grabtag plan --ref build/demo.png --spec examples/demo_spec.json --out build/reg
          grabtag build --dir build/reg

      - name: assert the exports
        run: |
          python - <<'PY'
          import json, pathlib, sys

          reg = pathlib.Path("build/reg")
          for name in ("cm.png", "montage.png", "regions.json", "tags.json"):
              assert (reg / name).exists(), name

          lay = json.loads((reg / "layout.json").read_text(encoding="utf-8"))
          items = lay["items"]
          assert len(items) == 4, items
          assert all(it.get("paint_prompt") or it.get("caption") for it in items), items
          for it in items:
              assert len(it["bbox"]) == 4, it
          audit = json.loads((reg / "layout.audit.json").read_text(encoding="utf-8"))
          assert audit, "audit file is empty"
          print("ok:", len(items), "items,", len(audit.get("items", audit)), "audit rows")
          PY

      - name: colormap tools smoke test
        run: |
          grabtag colormap --depth build/demo.png --bands 3 --out build/band.png
          test -s build/band.png

      - name: chroma smoke test on a synthetic green screen
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGB", (256, 256), (120, 200, 60))
          ImageDraw.Draw(im).ellipse((80, 40, 176, 216), fill=(210, 60, 70))
          im.save("build/green.png")
          PY
          grabtag chroma build/green.png --out build/keyed.png --preview build/keyed_p.png
          python - <<'PY'
          from PIL import Image
          a = Image.open("build/keyed.png").convert("RGBA")
          assert a.getpixel((2, 2))[3] == 0, "corner should be keyed out"
          assert a.getpixel((128, 128))[3] == 255, "subject should stay opaque"
          print("chroma ok")
          PY

  # 只测"安装态"：非可编辑安装，且一律在源码树之外（$RUNNER_TEMP）执行。
  # 2026-11-07 那次 CI 全红就是 editable 安装掩盖了「build 调用了没打包的
  # grabtag/core/moss_layout.py」——这条 job 专门守这类"本地能跑、装完就废"的 bug。
  installed:
    name: installed (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pip install . (not editable)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: every shipped module imports from site-packages
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import importlib, pkgutil
          import grabtag, grabtag.core as core

          print("grabtag from", grabtag.__file__)
          assert "site-packages" in grabtag.__file__, "not the installed copy"

          names = sorted(m.name for m in pkgutil.iter_modules(core.__path__))
          for n in names:
              importlib.import_module("grabtag.core." + n)
          print("ok: imported %d core modules: %s" % (len(names), ", ".join(names)))
          PY

      - name: grabtag build works from outside the source tree
        run: |
          cd "$RUNNER_TEMP"
          grabtag build --dir "$GITHUB_WORKSPACE/examples/ci_fixture" \
                        --layout "$RUNNER_TEMP/layout.json" --quiet
          python - <<'PY'
          import json, pathlib

          lay = json.loads(pathlib.Path("layout.json").read_text(encoding="utf-8"))
          items = lay["items"]
          assert len(items) == 2, items
          assert all(it.get("paint_prompt") or it.get("caption") for it in items), items
          print("ok: installed build produced", len(items), "items")
          PY

      - name: every subcommand answers --help
        run: |
          cd "$RUNNER_TEMP"
          for c in plan build colormap depth-colormap chroma hand-colormap autoregion; do
            grabtag "$c" --help > /dev/null || { echo "FAIL: grabtag $c --help"; exit 1; }
          done
          echo "ok: all subcommands respond to --help"
