[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grabtag"
version = "0.1.0"
description = "Region-level tagging and region-ID colour maps for reference-image conditioned diffusion"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.optional-dependencies]
mask = ["opencv-python>=4.8", "scipy>=1.10"]
sam = ["torch>=2.0", "segment-anything"]

[project.scripts]
grabtag = "grabtag.cli:main"

[tool.setuptools.packages.find]
include = ["grabtag*"]
